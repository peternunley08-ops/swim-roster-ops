name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Sync Engine Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run 3-Way Sync Engine Unit Tests
        run: node --test src/sync.test.mjs

      - name: Install dependencies
        run: npm install

      - name: Verify production Vite build
        run: npm run build
